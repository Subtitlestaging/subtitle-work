<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<title>H2O IV · Concept by subtitle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:#F7F2EA}
img,video{max-width:100%}

body{margin:0;background:#EEE6DA}
a{color:#1B2A3F}a:hover{color:#0E1724}
input::placeholder{color:#7A7064}
html{scroll-behavior:smooth}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;transition:box-shadow .5s ease,background-color .5s ease}
.is-scrolled .hdr{background-color:rgba(247,242,234,.88)!important;-webkit-backdrop-filter:saturate(1.2) blur(12px);backdrop-filter:saturate(1.2) blur(12px);box-shadow:0 14px 34px -22px rgba(20,27,36,.45)}
.nl{background-image:linear-gradient(currentColor,currentColor);background-size:0 1px;background-repeat:no-repeat;background-position:0 calc(100% - 8px);transition:background-size .45s cubic-bezier(.2,.7,.2,1)}
.nl:hover,.nl:focus-visible{background-size:100% 1px}
@media (max-width: 760px){.hdr nav .nl{display:none}.hdr nav .btn{padding:10px 16px!important;font-size:13px}.hdr>div{padding:12px 18px!important;gap:10px!important}}
.btn{transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s ease,filter .35s ease}
.btn:hover{transform:translateY(-1px);box-shadow:0 14px 28px -16px rgba(20,27,36,.55);filter:brightness(1.08)}
.btn:active{transform:translateY(0)}
.chip{transition:background-color .3s ease,color .3s ease,border-color .3s ease,transform .3s ease}
.chip:hover{transform:translateY(-1px)}
.zm{overflow:hidden;position:relative}
.zm>img,.zm>video{transition:transform 1.6s cubic-bezier(.2,.7,.2,1)}
.zm:hover>img,.zm:hover>video{transform:scale(1.035)}
.card{transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s ease}
.card:hover{transform:translateY(-4px);box-shadow:0 26px 50px -30px rgba(20,27,36,.45)}
.sway{transform-box:view-box;transform-origin:200px 30px}
.card:hover .sway{animation:sway 3.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.drop{opacity:0}
.card:hover .drop{animation:drop 1.8s cubic-bezier(.5,0,.8,.4) infinite}
@keyframes drop{0%{opacity:0;transform:translateY(0)}15%{opacity:.9}70%{opacity:.9}100%{opacity:0;transform:translateY(22px)}}
.tier{transition:transform .5s cubic-bezier(.2,.7,.2,1),outline-color .4s ease,box-shadow .5s ease}
.tier:hover{transform:translateY(-3px)}
.range{-webkit-appearance:none;appearance:none;width:100%;height:2px;background:#C9BBA7;border-radius:2px;outline:none;margin:18px 0}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#141B24;border:4px solid #F7F2EA;box-shadow:0 0 0 1px #141B24;cursor:pointer;transition:transform .3s ease}
.range::-webkit-slider-thumb:hover{transform:scale(1.1)}
.range::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#141B24;border:4px solid #F7F2EA;box-shadow:0 0 0 1px #141B24;cursor:pointer}
.range:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px #9CC3E6}
.fade{animation:fadeIn .6s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.rv-on .rv{opacity:0;transform:translateY(18px);transition:opacity 1s cubic-bezier(.2,.7,.2,1),transform 1s cubic-bezier(.2,.7,.2,1)}
.rv-on .rv.in{opacity:1;transform:none}
.rv-on .rv-s>*{opacity:0;transform:translateY(14px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.rv-on .rv-s.in>*{opacity:1;transform:none}
.rv-on .rv-s.in>*:nth-child(2){transition-delay:.08s}.rv-on .rv-s.in>*:nth-child(3){transition-delay:.16s}.rv-on .rv-s.in>*:nth-child(4){transition-delay:.24s}.rv-on .rv-s.in>*:nth-child(5){transition-delay:.32s}.rv-on .rv-s.in>*:nth-child(n+6){transition-delay:.4s}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}.rv-on .rv,.rv-on .rv-s>*{opacity:1!important;transform:none!important}}

</style>
</head>
<body>
<div id="app"></div>
<template id="dc-tpl">
<div style="font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; color: #141B24; background: #EEE6DA; min-height: 100vh">

  <!-- Header -->
  <header class="hdr" style="background: #F7F2EA; border-bottom: 1px solid #DDD2C2">
    <div style="max-width: 1240px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
      <a href="#top" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #141B24">
        <svg width="30" height="34" viewBox="0 0 30 34" fill="none" aria-hidden="true"><path d="M15 2 28 31H2L15 2Z" stroke="#141B24" stroke-width="1.8" stroke-linejoin="round"></path><path d="M15 2v29M11 11v20M19 11v20" stroke="#141B24" stroke-width="1.4"></path></svg>
        <span style="display: flex; flex-direction: column; gap: 1px">
          <span style="font-family: Manrope, Inter, sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.08em; line-height: 1">H2O IV</span>
          <span style="font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #5A5248">Hydration on Demand</span>
        </span>
      </a>
      <nav aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 24px; font-size: 14px; font-weight: 500">
        <a class="nl" href="#treatments" style="color: #141B24; text-decoration: none; padding: 12px 0">IV Treatments</a>
        <a class="nl" href="#shots" style="color: #141B24; text-decoration: none; padding: 12px 0">IM Shots</a>
        <a class="nl" href="#packages" style="color: #141B24; text-decoration: none; padding: 12px 0">Packages</a>
        <a class="nl" href="#membership" style="color: #141B24; text-decoration: none; padding: 12px 0">Membership</a>
        <a class="nl" href="#peptides" style="color: #141B24; text-decoration: none; padding: 12px 0">Peptides</a>
        <a class="btn" href="#book" style="background: {{accent}}; color: #FFFFFF; text-decoration: none; padding: 12px 22px; border-radius: 999px; font-weight: 600">Book online</a>
      </nav>
    </div>
  </header>

  <!-- Hero -->
  <section id="top" style="max-width: 1240px; margin: 0 auto; padding: 56px 24px 64px; display: flex; flex-wrap: wrap; align-items: center; gap: 48px">
    <div class="rv-s" style="flex: 1 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 22px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #5A5248">Miami’s Premier IV Hydration</span>
      <h1 style="margin: 0; font-family: Manrope, Inter, sans-serif; font-weight: 700; font-size: clamp(40px, 5.2vw, 66px); line-height: 1.04; letter-spacing: -0.035em">Hydration on demand. Feel better by the end of the drip.</h1>
      <p style="margin: 0; font-size: 18px; line-height: 1.65; color: #4A433B; max-width: 540px">Vitamins and hydration delivered straight into your bloodstream for maximum absorption and quick results. Kick back in our lounge, scroll your phone, take a call, and walk out recharged.</p>
      <div style="display: flex; flex-wrap: wrap; gap: 12px; padding-top: 6px">
        <a class="btn" href="#book" style="background: {{accent}}; color: #FFFFFF; text-decoration: none; padding: 16px 28px; border-radius: 999px; font-weight: 600; font-size: 16px">Book online in 60 seconds</a>
        <a class="btn" href="#finder" style="background: transparent; color: #141B24; text-decoration: none; padding: 15px 27px; border-radius: 999px; font-weight: 600; font-size: 16px; border: 1.5px solid #141B24">Find your drip</a>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 28px; padding-top: 14px">
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: Manrope, Inter, sans-serif; font-weight: 700; font-size: 26px">10 drips</span><span style="font-size: 13px; color: #5A5248">from $110</span></div>
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: Manrope, Inter, sans-serif; font-weight: 700; font-size: 26px">IM shots</span><span style="font-size: 13px; color: #5A5248">from $30</span></div>
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: Manrope, Inter, sans-serif; font-weight: 700; font-size: 26px">Save $550</span><span style="font-size: 13px; color: #5A5248">with a 10-drip package</span></div>
      </div>
    </div>
    <div class="rv-s" style="flex: 1 1 420px; min-width: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px">
      <div class="zm" style="grid-column: span 3; grid-row: span 2; min-height: 440px; border-radius: 26px"><img src="images/lounge.jpg" alt="Client relaxing in a lounge recliner during his IV drip, with the H2O IV sign glowing behind him" style="width: 100%; height: 100%; object-fit: cover; object-position: 62% 50%; display: block; position: absolute; inset: 0"></div>
      <div class="zm" style="grid-column: span 2; aspect-ratio: 4 / 5; border-radius: 22px"><img src="images/beach-friends.jpg" alt="Two friends laughing over an H2O IV bag on a branded beach towel" style="width: 100%; height: 100%; object-fit: cover; object-position: 55% 40%; display: block"></div>
      <div class="zm" style="grid-column: span 2; aspect-ratio: 4 / 5; border-radius: 22px"><img src="images/clinician-prep.jpg" alt="Gloved clinician preparing an H2O IV bag" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; display: block"></div>
    </div>
  </section>

  <!-- Miami band -->
  <section aria-label="Hydrate in Miami" style="background: #141B24; color: #FFFFFF">
    <div style="display: flex; flex-wrap: wrap; align-items: stretch">
      <div class="rv-s" style="flex: 1 1 380px; min-width: 0; padding: clamp(40px, 6vw, 80px) clamp(24px, 5vw, 72px); display: flex; flex-direction: column; justify-content: center; gap: 16px; box-sizing: border-box">
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #D9CDBC">Hydrate in Miami</span>
        <h2 class="rv" style="margin: 0; font-family: Manrope, Inter, sans-serif; font-weight: 700; font-size: clamp(30px, 3.4vw, 44px); line-height: 1.1; letter-spacing: -0.03em">Elite wellness for a city that never slows down.</h2>
        <p style="margin: 0; font-size: 17px; line-height: 1.65; color: #D3DAE3; max-width: 460px">Heat, humidity, late nights and early flights. Replenish what Miami takes out of you, one drip at a time.</p>
        <a class="btn" href="#book" style="align-self: flex-start; margin-top: 8px; background: #F7F2EA; color: #141B24; text-decoration: none; padding: 15px 26px; border-radius: 999px; font-weight: 600; font-size: 15px">Book your drip</a>
      </div>
      <div class="zm" style="flex: 1.4 1 480px; min-width: 0; min-height: 340px"><img src="images/miami-skyline.jpg" alt="IV drip overlooking the Miami skyline and Biscayne Bay at dusk" style="width: 100%; height: 100%; object-fit: cover; object-position: 60% 50%; display: block; position: absolute; inset: 0"></div>
    </div>
  </section>

  <!-- New to IV therapy -->
  <section style="background: #F7F2EA">
    <div style="max-width: 1240px; margin: 0 auto; padding: 80px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 40px 72px">
      <div class="rv-s" style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #5A5248">New to IV therapy?</span>
        <h2 class="rv" style="margin: 0; font-family: Manrope, Inter, sans-serif; font-weight: 700; font-size: clamp(30px, 3.3vw, 42px); line-height: 1.12; letter-spacing: -0.03em">A fast, effective way to boost energy, recover and feel your best</h2>
        <p style="margin: 0; font-size: 17px; line-height: 1.7; color: #4A433B">IV therapy delivers essential vitamins and hydration directly into your bloodstream. Because it skips digestion, your body absorbs more of each drip, and you feel the results sooner.</p>
        <p style="margin: 0; font-size: 17px; line-height: 1.7; color: #4A433B">Most drips come in a full 1L bag or a lighter 500ml size. Every visit starts with a short health screening, then you sit back while your drip runs. Safe, convenient and customizable.</p>
      </div>
      <video src="images/bag-loop.mp4" poster="images/bag-loop-poster.jpg" autoplay muted loop playsinline aria-label="An H2O IV bag hanging and gently turning" style="flex: 0 1 380px; min-width: 0; width: 100%; max-width: 400px; aspect-ratio: 480 / 624; object-fit: cover; border-radius: 26px; display: block; background: #E6E2DC"></video>
    </div>
  </section>

  

  <!-- Drip finder -->
  <section id="finder" style="max-width: 1240px; margin: 0 auto; padding: 80px 24px">
    <div class="rv" style="background: #1B2A3F; color: #FFFFFF; border-radius: 32px; padding: clamp(28px, 5vw, 56px); display: flex; flex-wrap: wrap; gap: 40px">
      <div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #D9CDBC">Drip finder</span>
        <h2 class="rv" style="margin: 0; font-family: Manrope, Inter, sans-serif; font-weight: 700; font-size: clamp(28px, 3vw, 38px); line-height: 1.12; letter-spacing: -0.03em">Not sure where to start? Two questions.</h2>
        <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #D3DAE3">We’ll match you to a drip and the best way to buy it.</p>
      </div>
      <div style="flex: 1 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
        <div role="group" aria-label="What do you need today?" style="display: flex; flex-direction: column; gap: 10px">
          <span style="font-size: 15px; font-weight: 600">1. What do you need today?</span>
          <div style="display: flex; flex-wrap: wrap; gap: 8px">
            <sc-for list="{{goalOpts}}" as="o" hint-placeholder-count="8">
              <button class="chip" type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.label}}</button>
            </sc-for>
          </div>
        </div>
        <div role="group" aria-label="How often?" style="display: flex; flex-direction: column; gap: 10px">
          <span style="font-size: 15px; font-weight: 600">2. How often would you come in?</span>
          <div style="display: flex; flex-wrap: wrap; gap: 8px">
            <sc-for list="{{freqOpts}}" as="o" hint-placeholder-count="3">
              <button class="chip" type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.label}}</button>
            </sc-for>
          </div>
        </div>
        <sc-if value="{{hasResult}}" hint-placeholder-val="{{ true }}">
          <div style="background: #F7F2EA; color: #141B24; border-radius: 20px; padding: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 18px">
            <svg viewBox="110 14 180 272" aria-hidden="true" style="width: 76px; height: 115px; display: block; flex: none; border-radius: 12px; background: {{result.bg}}">
              <rect x="130" y="28" width="140" height="224" rx="18" fill="#FFFFFF" opacity="0.45"></rect>
              <rect x="136" y="58" width="128" height="188" rx="14" fill="{{result.fluid}}"></rect>
              <rect x="149" y="70" width="102" height="152" rx="5" fill="#141B24"></rect>
              <path d="M200 84 223 130H177L200 84Z" fill="none" stroke="#F7F2EA" stroke-width="2" stroke-linejoin="round"></path>
              <path d="M200 84V130M193 102V130M207 102V130" stroke="#F7F2EA" stroke-width="1.6"></path>
              <text x="200" y="160" text-anchor="middle" font-family="Manrope, Inter, sans-serif" font-size="22" font-weight="500" letter-spacing="2" fill="#9CC3E6">H2O IV</text>
              <rect x="190" y="250" width="20" height="14" rx="3" fill="#F7F2EA"></rect>
            </svg>
            <div style="flex: 1 1 240px; display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #5A5248">Your match</span>
              <span style="font-family: Manrope, Inter, sans-serif; font-weight: 700; font-size: 22px">{{result.drip}}</span>
              <span style="font-size: 15px; line-height: 1.55; color: #4A433B">{{result.how}}</span>
            </div>
            <a class="btn" href="#book" onClick="{{result.use}}" style="background: #1B2A3F; color: #FFFFFF; text-decoration: none; padding: 14px 22px; border-radius: 999px; font-weight: 600; font-size: 15px">Book this drip</a>
          </div>
        </sc-if>
      </div>
    </div>
  </section>

  <!-- Treatments -->
  <section id="treatments" style="max-width: 1240px; margin: 0 auto; padding: 0 24px 80px">
    <div style="display: flex; flex-direction: column; gap: 12px; padding-bottom: 24px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #5A5248">IV Treatments</span>
      <h2 class="rv" style="margin: 0; font-family: Manrope, Inter, sans-serif; font-weight: 700; font-size: clamp(30px, 3.3vw, 42px); line-height: 1.12; letter-spacing: -0.03em">The drip menu</h2>
    </div>
    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 24px">
      <div role="group" aria-label="Filter drips" style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
          <button class="chip" type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">{{c.label}}</button>
        </sc-for>
      </div>
      <div role="group" aria-label="Bag size" style="display: flex; background: #F7F2EA; border: 1px solid #DDD2C2; border-radius: 999px; padding: 4px; gap: 4px">
        <sc-for list="{{sizeOpts}}" as="s" hint-placeholder-count="2">
          <button class="chip" type="button" onClick="{{s.pick}}" aria-pressed="{{s.pressed}}" style="{{s.style}}">{{s.label}}</button>
        </sc-for>
      </div>
    </div>
    <div class="rv" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px">
      <sc-for list="{{drips}}" as="d" hint-placeholder-count="6">
        <article class="card fade" style="background: #F7F2EA; border: 1px solid #DDD2C2; border-radius: 26px; overflow: hidden; display: flex; flex-direction: column">
          <svg viewBox="0 0 400 300" role="img" aria-label="{{d.name}} drip bag" style="width: 100%; height: auto; display: block">
            <rect width="400" height="300" fill="{{d.bg}}"></rect>
            <circle cx="330" cy="60" r="120" fill="#FFFFFF" opacity="0.08"></circle>
            <ellipse cx="204" cy="272" rx="86" ry="9" fill="#141B24" opacity="0.22"></ellipse>
            <g class="sway"><g transform="rotate({{d.rot}} 200 150)">
              <rect x="130" y="28" width="140" height="224" rx="18" fill="#FFFFFF" opacity="0.45"></rect>
              <rect x="136" y="58" width="128" height="188" rx="14" fill="{{d.fluid}}"></rect>
              <rect x="130" y="28" width="140" height="22" rx="11" fill="#FFFFFF" opacity="0.6"></rect>
              <circle cx="200" cy="39" r="5" fill="{{d.bg}}"></circle>
              <rect x="149" y="70" width="102" height="152" rx="5" fill="#141B24"></rect>
              <path d="M200 84 223 130H177L200 84Z" fill="none" stroke="#F7F2EA" stroke-width="1.4" stroke-linejoin="round"></path>
              <path d="M200 84V130M193 102V130M207 102V130" stroke="#F7F2EA" stroke-width="1.1"></path>
              <text x="200" y="154" text-anchor="middle" font-family="Manrope, Inter, sans-serif" font-size="19" font-weight="500" letter-spacing="2" fill="#9CC3E6">H2O IV</text>
              <text x="200" y="166" text-anchor="middle" font-family="Inter, sans-serif" font-size="5.4" letter-spacing="1.3" fill="#C9D2DC">HYDRATION ON DEMAND</text>
              <path d="M182 178H218" stroke="#5A6B80" stroke-width="0.8"></path>
              <text x="200" y="194" text-anchor="middle" font-family="Manrope, Inter, sans-serif" font-size="8.6" font-weight="700" letter-spacing="1.6" fill="#F7F2EA">{{d.l1}}</text>
              <text x="200" y="206" text-anchor="middle" font-family="Manrope, Inter, sans-serif" font-size="8.6" font-weight="700" letter-spacing="1.6" fill="#F7F2EA">{{d.l2}}</text>
              <rect x="143" y="66" width="5" height="170" rx="2.5" fill="#FFFFFF" opacity="0.35"></rect>
              <rect x="190" y="250" width="20" height="14" rx="3" fill="#F7F2EA" stroke="#141B24" stroke-opacity="0.35"></rect>
              <path class="drop" d="M200 266c0 0-3.2 3.6-3.2 5.6a3.2 3.2 0 0 0 6.4 0c0-2-3.2-5.6-3.2-5.6Z" fill="{{d.fluid}}" stroke="#141B24" stroke-opacity="0.25" stroke-width="0.6"></path>
            </g></g>
          </svg>
          <div style="padding: 24px; display: flex; flex-direction: column; gap: 10px; flex: 1">
            <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap">
              <h3 style="margin: 0; font-family: Manrope, Inter, sans-serif; font-size: 21px; font-weight: 700; letter-spacing: -0.02em">{{d.name}}</h3>
              <span style="font-family: Manrope, Inter, sans-serif; font-weight: 700; font-size: 24px">{{d.price}}<span style="font-size: 13px; font-weight: 500; color: #5A5248"> {{d.unit}}</span></span>
